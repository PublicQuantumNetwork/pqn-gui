@keyframes qf-rise{0%,48%{transform:translateY(0)}55%{transform:translateY(-74px)}58%{transform:translateY(-74px) rotate(-5deg)}62%{transform:translateY(-74px) rotate(5deg)}66%,76%{transform:translateY(-74px) rotate(0)}82%,100%{transform:translateY(0)}}
.monster-rise{animation:qf-rise 10s ease-in-out 2s infinite}
.pump{display:block;transform-origin:50% 100%}
@keyframes qf-pop-a{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.4)}55%{transform:translateY(0) scale(0.88,1.08)}75%{transform:scale(1.08,0.94)}100%{transform:scale(1)}}
@keyframes qf-pop-b{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.4)}55%{transform:translateY(0) scale(0.88,1.08)}75%{transform:scale(1.08,0.94)}100%{transform:scale(1)}}
@keyframes qf-hop-a{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px)}60%{transform:translateY(0) scale(1.06,0.94)}78%{transform:translateY(-3px)}}
@keyframes qf-hop-b{0%,100%{transform:translateY(0)}35%{transform:translateY(-10px)}60%{transform:translateY(0) scale(1.06,0.94)}78%{transform:translateY(-3px)}}
@keyframes qf-shiver-a{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
@keyframes qf-shiver-b{0%,100%{transform:rotate(0)}20%{transform:rotate(-5deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.pop-a{animation:qf-pop-a 650ms ease-out both}
.pop-b{animation:qf-pop-b 650ms ease-out both}
.hop-a{animation:qf-hop-a 520ms ease-out both}
.hop-b{animation:qf-hop-b 520ms ease-out both}
.shiver-a{animation:qf-shiver-a 480ms ease-in-out both}
.shiver-b{animation:qf-shiver-b 480ms ease-in-out both}
@keyframes qf-spark{0%{transform:scale(0.35);opacity:1}100%{transform:scale(1.25);opacity:0}}
.sparks{transform-box:view-box;transform-origin:60px 62px;animation:qf-spark 700ms ease-out both}
@media (prefers-reduced-motion: reduce){.spider,.bats,.mist,.flicker,.twinkle,.twinkle-late,.monster-rise,.pop-a,.pop-b,.hop-a,.hop-b,.shiver-a,.shiver-b{animation:none}.sparks{display:none}}

<script type="text/x-dc" data-dc-script data-props="{&quot;pumpkin&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff5f05&quot;,&quot;options&quot;:[&quot;#ff5f05&quot;,&quot;#c84113&quot;,&quot;#fcb316&quot;]},&quot;dusk&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;progress&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:6},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980}}">
class Component extends DCLogic {
renderVals() {
var fill = this.props.pumpkin ?? '#ff5f05';
var start = Math.max(0, Math.min(6, Math.round(this.props.progress ?? 2)));
var presses = (this.state && this.state.presses != null) ? this.state.presses : start;
var pressed = !!(this.state && this.state.presses != null);
var parity = presses % 2 === 0 ? 'a' : 'b';
var newest = presses - 1;
var lanterns = [];
for (var i = 0; i < 7; i++) {
var cls = 'pump';
if (pressed) {
if (i === newest) { cls = 'pump pop-' + parity; }
else if (i < newest) { cls = 'pump hop-' + parity; }
else { cls = 'pump shiver-' + parity; }
}
lanterns.push({
lit: i < presses,
unlit: i >= presses,
fill: fill,
cls: cls,
pop: pressed && i === newest,
delay: (pressed ? Math.abs(i - newest) * 70 : 0) + 'ms'
});
}
var self = this;
return {
pumpkin: fill,
dusk: this.props.dusk ?? false,
shown: presses + 1,
lanterns: lanterns,
progressLabel: presses + ' of 7 pumpkins lit',
ready: presses >= 6,
notReady: presses < 6,
press: function () { self.setState({ presses: Math.min(6, presses + 1) }); }
};
}
}
</script>
