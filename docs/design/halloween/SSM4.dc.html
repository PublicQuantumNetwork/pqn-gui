.spark{transform-box:fill-box;transform-origin:50% 50%;animation:ssm4-twinkle 1.6s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){.spider,.bats,.ghost,.flicker,.reveal,.spark,.spark-late,.monster-wolf,.wolf-arm-l,.wolf-arm-r{animation:none}.particle{display:none}}

<script type="text/x-dc" data-dc-script data-props="{&quot;pumpkin&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ff5f05&quot;,&quot;options&quot;:[&quot;#ff5f05&quot;,&quot;#c84113&quot;,&quot;#fcb316&quot;]},&quot;dusk&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false},&quot;emoji&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;🎃&quot;,&quot;options&quot;:[&quot;🎃&quot;,&quot;👻&quot;,&quot;🦇&quot;,&quot;🕷️&quot;,&quot;💀&quot;,&quot;🧛&quot;,&quot;🔮&quot;,&quot;🦉&quot;,&quot;🍬&quot;,&quot;🌕&quot;]},&quot;matching&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:8},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;min&quot;:1,&quot;max&quot;:8},&quot;success&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;leader&quot;,&quot;options&quot;:[&quot;leader&quot;,&quot;follower&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980}}">
class Component extends DCLogic {
renderVals() {
var emoji = this.props.emoji ?? '🎃';
var total = Math.max(1, Math.round(this.props.total ?? 8));
var matching = Math.max(0, Math.min(total, Math.round(this.props.matching ?? 8)));
var success = this.props.success ?? true;
var role = this.props.role ?? 'leader';
var perfect = success && matching === total && total > 0;
var message = '';
var message2 = '';
if (!success) {
message = 'There was an error, we will work on this.';
message2 = 'Please try a different game.';
} else if (perfect) {
message = 'Woo!! Hoo!!';
message2 = 'You and your friend are in perfect sync!';
} else if (role === 'leader') {
message = 'You sent the message now. If it is too blurry you might need to agree on more questions.';
} else if (role === 'follower') {
message = 'You have received this message. If it is too blurry you might need to agree on more questions.';
} else {
message = 'Your quantum key distribution result is...';
}
var blur = (1 - matching / total) * 25;
var particles = [];
var count = 30;
for (var i = 0; i < count; i++) {
var angle = (i / count) * Math.PI * 2;
var r1 = Math.abs(Math.sin(i * 12.9898 + 4.1414)) % 1;
var r2 = Math.abs(Math.sin(i * 78.233 + 1.7)) % 1;
var r3 = Math.abs(Math.sin(i * 39.425 + 2.3)) % 1;
var distance = 120 + r1 * 180;
particles.push({
ex: (Math.cos(angle) * distance).toFixed(1) + 'px',
ey: (Math.sin(angle) * distance).toFixed(1) + 'px',
dur: (1.9 + r2 * 0.2).toFixed(2) + 's',
delay: (r3 * 0.1).toFixed(2) + 's'
});
}
return {
pumpkin: this.props.pumpkin ?? '#ff5f05',
dusk: this.props.dusk ?? false,
emoji: emoji,
emojiLabel: 'Secret message: ' + emoji,
matching: matching,
total: total,
rate: ((matching / total) * 100).toFixed(1),
blurFilter: 'blur(' + blur.toFixed(1) + 'px)',
success: success,
perfect: perfect,
notPerfect: !perfect,
message: message,
message2: message2,
hasMessage2: message2 !== '',
particles: particles
};
}
}
</script>
